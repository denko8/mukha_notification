name: smart_notes
description: "Smart Notes MVP — умная напоминалка в стиле Japandi (теплый минимализм)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Storage / utils
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.20.3
  uuid: ^4.4.0

  # Local reminders
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Attachments
  image_picker: ^1.1.2
  file_picker: ^8.0.6

  # P2/P3 features
  # Голосовой ввод — полностью офлайн на встроенной Vosk-модели.
  # Модель русского (~45 МБ) скачивается один раз при первом
  # использовании и в APK не упакована — приложение остаётся лёгким.
  vosk_flutter: ^0.3.48
  archive: ^3.6.1                 # распаковка zip модели
  # 10.x, а не 11.x: опубликованный vosk_flutter 0.3.48 требует ^10.2.0
  permission_handler: ^10.2.0    # запрос доступа к микрофону
  audioplayers: ^6.1.0            # плеер аудиовложений
  url_launcher: ^6.3.1            # открытие ссылок/календаря
  google_mlkit_text_recognition: ^0.15.0  # OCR (мобильные)
  in_app_purchase: ^3.2.0         # PRO-подписка
  app_links: ^6.3.2               # deep links семейных инвайтов
  http: ^1.2.2                    # AI-распознавание (OpenAI-совместимые API)

  # Sharing / export / invites
  share_plus: ^7.2.2
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.2
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
