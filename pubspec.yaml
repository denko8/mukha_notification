name: smart_notes
description: "Smart Notes MVP — умная напоминалка в стиле Japandi (теплый минимализм)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Storage / utils
  path_provider: ^2.1.3
  intl: ^0.20.3
  uuid: ^4.4.0

  # Local reminders
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Attachments
  image_picker: ^1.1.2
  file_picker: ^8.0.6

  # Sharing / export / invites
  share_plus: ^7.2.2
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.2
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
