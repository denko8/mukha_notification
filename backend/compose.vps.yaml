# Standalone deployment candidate, NOT an override of compose.yaml.
# docker compose -f compose.vps.yaml up -d --build
name: smartnotes
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartnotes
      POSTGRES_DB: smartnotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U smartnotes -d smartnotes"]
      interval: 5s
      retries: 10
    networks: [private]
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://smartnotes:${POSTGRES_PASSWORD}@db:5432/smartnotes
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
  api:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgresql+psycopg://smartnotes:${POSTGRES_PASSWORD}@db:5432/smartnotes
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [private]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [private, edge]
networks:
  private:
    internal: true
  edge:
volumes:
  pgdata:
  caddy_data:
  caddy_config:
