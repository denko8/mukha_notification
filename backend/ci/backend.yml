name: Backend tests
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartnotes
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: smartnotes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartnotes -d smartnotes"
          --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://smartnotes:ci-only-not-a-real-secret@localhost:5432/smartnotes
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
      - run: docker compose -f compose.vps.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          API_DOMAIN: api.example.com
          ACME_EMAIL: ci@example.com
      - run: docker compose up -d --build
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
      - run: curl --fail --retry 20 --retry-connrefused --retry-delay 3 http://localhost:8000/ready
      - run: docker run --rm -e API_DOMAIN=api.example.com -e ACME_EMAIL=ci@example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - if: failure()
        run: docker compose logs --tail 100
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
      - if: always()
        run: docker compose down -v
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
