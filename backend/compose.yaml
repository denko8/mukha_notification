# Local development only: the API is deliberately not exposed publicly.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartnotes
      POSTGRES_DB: smartnotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set a random password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U smartnotes -d smartnotes"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://smartnotes:${POSTGRES_PASSWORD}@db:5432/smartnotes
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://smartnotes:${POSTGRES_PASSWORD}@db:5432/smartnotes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  pgdata:
